 _01_do_while_loop.cpp\n│   └── _02_basics.cpp\n└── 05 problems/\n    └── 01 Prime number/\n        ├── _01_practice.cpp\n        └── _02_prime_number_02.cpp\n\nCH 05 Statements/\n├── 01 Break/\n│   ├── _01_break.cpp\n│   └── _02_practice.cpp\n└── 02 Continue/\n    ├── _01_continue.cpp\n    └── _02_problem.cpp\n\nCH 06 Patterns/\n    ├── 01 Problems/\n        ├── _01_problem_01.cpp\n        ├── _01_problem_genral_approacj.cpp\n        ├── _02_star_Pattern.cpp\n        ├── _03_inverted_star_pattern.cpp\n        ├── _04_half_pyramid_pattern.cpp\n        ├── _05_print_character_pyramid_pattern.cpp\n        ├── _06_hollow_rectangle_pattern.cpp\n        ├── _07_inverted_and_roated_half_pyramid.cpp\n        ├── _08_floyds_triangle.cpp\n        ├── _09_diamond_pattern.cpp\n        ├── _10_buttet_fly_pattern.cpp\n    ├── 03 Assignment Solution/\n        ├── _01_0_1_triangle.cpp\n        ├── _02_Rhombus_pattern.cpp\n        ├── _03_palindrome_pattern_with_numbers.cpp\n\nCH 07 Function/\n    ├── 01 Function intro/01 Basic things/\n        ├── _01_function_basic.cpp\n        ├── _02_function_basic.cpp\n        ├── _03_declaration.cpp\n        ├── _04_function_definition.cpp\n        ├── _05_forward_declaration.cpp\n        ├── _06_function_declaration_and_parameters.cpp\n        ├── _07_default_argument.cpp\n    ├── 01 Function intro/02 Practice Problems/\n        ├── _01_problem_01.cpp\n        ├── _02_odd_or_even.cpp\n        ├── _03_factorial.cpp\n    ├── 01 Function intro/03 scope/\n        ├── _01_local_scope.cpp\n        ├── _02_global_variable.cpp\n    ├── 01 Function intro/04 Practice problem/\n        ├── _01_prime_number.cpp\n        ├── _02_print_prime.cpp\n        ├── _03_binomial_coefficient.cpp\n    ├── 02 Function Overloading/\n        ├── _01_function_overloading.cpp\n\nCH 08 Binary Number System/\n    ├── 01 Basics/\n    │   ├── _01_data_type_modifiers.cpp\n    │   ├── _02_number_to_binary.cpp\n    │   └── _03_decimal_to_binary.cpp\n```\n\n</details>\n\n---\n\n## 🤝 Contributing\n\nContributions, suggestions, and improvements are welcome!\n\n1. **Fork** the repository.\n2. **Create** a feature branch: `git checkout -b feature/new-topic`.\n3. **Commit** your changes: `git commit -m \"add: topic name\"`.\n4. **Push** to the branch: `git push origin feature/new-topic`.\n5. **Open** a Pull Request.\n\n### Contribution Ideas\n- 📌 Add a new DSA topic folder following the `CH xx` numbering convention.\n- 🧪 Add more practice problems with edge cases.\n- 🐛 Fix bugs or improve existing solutions.\n- 📝 Improve comments, naming, or documentation.\n- ⚡ Add optimized versions of existing solutions (time/space complexity).\n\n> Please keep code self-contained, well-commented, and compile-clean with `-Wall -Wextra`.\n\n---\n\n## 📚 Recommended Resources\n\n\n- 📘 [C++ Reference (cppreference)](https://en.cppreference.com/)\n- 🧠 [LeetCode](https://leetcode.com/) · [Codeforces](https://codeforces.com/) · [GeeksforGeeks](https://www.geeksforgeeks.org/)\n- 🛠️ [Compiler Explorer (Godbolt)](https://godbolt.org/) — see what your C++ compiles to\n- 📖 *Competitive Programming 4* by Steven Halim (for the advanced phase)\n\n---\n\n## 👤 Author\n\n**Shubham Mourya** (GitHub: [@shubham17290](https://github.com/shubham17290))\n\n- 📧 Email: `smourya1046@gmail.com`\n- 🌱 Currently learning: C++ & Data Structures & Algorithms\n\n> *\"The best time to plant a tree was 20 years ago. The second best time is now.\"*\n\n---\n\n## ⭐ Show Your Support\n\nIf this repository helped you learn something new, please consider giving it a **star** ⭐ — it keeps the motivation going and helps others discover it.\n\n<div align=\"center\">\n\n### Happy Coding! 💻✨\n\n*Made with ❤️ and a lot of `cout << \"Hello, World!\";`*\n\n</div>\n"};
const files = (DATA && DATA.files) ? DATA.files.map(f=>f.path) : [];

function groupFiles(list){
  const root={};
  for(const f of list){
    const parts=f.split('/');
    let cur=root;
    for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
    (cur.__files=cur.__files||[]).push(f);
  }
  return root;
}

const treeEl=document.getElementById('tree');
const contentEl=document.getElementById('content');
const titleEl=document.getElementById('title');
const searchEl=document.getElementById('search');
const copyBtn=document.getElementById('copybtn');
const toast=document.getElementById('toast');
let currentText='';

function renderTree(list){
  const q=searchEl.value.trim().toLowerCase();
  const filtered=q?list.filter(f=>f.toLowerCase().includes(q)):list;
  treeEl.innerHTML='';
  const root=groupFiles(filtered);
  function build(node){
    const frag=document.createDocumentFragment();
    const folders=Object.keys(node).filter(k=>k!=='__files').sort();
    for(const folder of folders){
      const det=document.createElement('details');
      det.className='folder';
      det.open=true;
      const sum=document.createElement('summary');
      sum.innerHTML=`<span class="icon">📁</span><span>${folder}</span>`;
      det.appendChild(sum);
      const child=document.createElement('div');
      child.className='children';
      child.appendChild(build(node[folder]));
      det.appendChild(child);
      frag.appendChild(det);
    }
    for(const f of (node.__files||[]).sort()){
      const btn=document.createElement('button');
      btn.className='file';
      btn.innerHTML=`<span class="icon">📄</span><span class="name">${f.split('/').pop()}</span>`;
      btn.title=f;
      btn.dataset.path=f;
      btn.addEventListener('click',()=>openFile(f));
      frag.appendChild(btn);
    }
    return frag;
  }
  treeEl.appendChild(build(root));
}

searchEl.addEventListener('input',()=>renderTree(files));

function findEntry(path){return (DATA.files||[]).find(f=>f.path===path);}

function openFile(path){
  document.querySelectorAll('.file').forEach(e=>e.classList.toggle('active',e.dataset.path===path));
  titleEl.textContent=path.split('/').pop();
  const entry=findEntry(path);
  currentText=entry?entry.content:'';
  const lines=currentText.split('\n').length;
  contentEl.innerHTML='';
  const card=document.createElement('div');
  card.className='card code-card';
  card.innerHTML=`
    <header><span class="fname">${path}</span><span style="font-size:11px;color:var(--muted)">${lines} lines</span></header>
    <pre><code class="language-cpp"></code></pre>`;
  const code=card.querySelector('code');
  code.textContent=currentText;
  contentEl.appendChild(card);
  hljs.highlightElement(code);
}

function showReadme(){
  document.querySelectorAll('.file').forEach(e=>e.classList.remove('active'));
  titleEl.textContent='README.md';
  currentText=DATA.readme||'';
  contentEl.innerHTML='';
  const div=document.createElement('div');
  div.className='readme';
  div.innerHTML=marked.parse(currentText);
  contentEl.appendChild(div);
}

copyBtn.addEventListener('click',async()=>{
  if(!currentText){showToast('Nothing to copy');return;}
  try{await navigator.clipboard.writeText(currentText);showToast('Copied to clipboard');}
  catch{showToast('Copy failed');}
});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

// init
document.getElementById('statFiles').textContent=files.length;
const chapters=new Set(files.map(f=>f.split('/')[0]));
document.getElementById('statChapters').textContent=chapters.size;
document.getElementById('chip').textContent=files.length+' files';
renderTree(files);
</script>
