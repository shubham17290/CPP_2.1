i] << endl;\r\n    }\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/01 basic/_03_creationg_of_array_02.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    //  method : 02 to declare the array -> defining array with it's proper values and size\r\n    int marks[50] = {1, 2, 3, 4};\r\n    int sz = sizeof(marks) / sizeof(marks[0]);\r\n    cout << \"Size of the array : \" << sizeof(marks) / sizeof(marks[0]) << endl;\r\n    for (int i = 0; i <= 3; i++) {\r\n        cout << marks[i] << endl;\r\n    }\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/01 basic/_04_creationg_of_array_03.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    //  method : 03 of defining the array with its value and no mention of the size and it will\r\n    //  mention there automatically !\r\n    int marks[] = {1, 2, 3, 4, 5, 6};\r\n\r\n    int sz = sizeof(marks) / sizeof(marks[0]);\r\n    cout << \"Size of the array : \" << sizeof(marks) / sizeof(marks[0]) << endl;\r\n    for (int i = 0; i < sz; i++) {\r\n        cout << marks[i] << endl;\r\n    }\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/02 input and output/_01_output.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    int arr[] = {12, 12, 13, 14, 15};\r\n    // int n = sizeof(marks) / sizeof(marks[0]);\r\n    int n = sizeof(arr) / sizeof(int);\r\n    for (int i = 0; i < n; i++) {\r\n        cout << \"Value at \" << i << \" : \" << arr[i] << endl;\r\n    }\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/02 input and output/_02_input_array_value.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n\r\n    //  input the length of array\r\n    int n;\r\n    cout << \"enter the size of the array : \" << endl;\r\n    cin >> n;\r\n    int arr[n];\r\n\r\n    // int n = sizeof(arr) / sizeof(int);\r\n\r\n    cout << \"Enter array values sir:\" << endl;\r\n    for (int i = 0; i < n; i++) {\r\n        cin >> arr[i];\r\n    }\r\n    cout << \"here is your array values : \" << endl;\r\n    for (int i = 0; i < n; i++) {\r\n        cout << arr[i] << \" , \";\r\n    }\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_01_largest_element_in_array.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    int arr[] = {5, 4, 3, 9, 12};\r\n\r\n    int n = sizeof(arr) / sizeof(int);\r\n    int max = arr[0];\r\n    int min = arr[0];\r\n    //  traverse all the element of the array !\r\n    for (int i = 0; i < n; i++) {\r\n\r\n        if (arr[i] > max) // compare buddy !\r\n        {\r\n            max = arr[i];\r\n        }\r\n        if (arr[i] < min) {\r\n            min = arr[i];\r\n        }\r\n    }\r\n    cout << \"largest = \" << max << endl;\r\n    cout << \"smallest = \" << min << endl;\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_02_array_passed_by_reference.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    int a = 5;\r\n    int *ptr = &a;\r\n    cout << ptr << endl; // address-> 0x..\r\n\r\n    int arr[] = {1, 2, 3, 4, 5};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    cout << *arr << endl;\r\n    cout << *(arr + 1) << endl; // arr[1]\r\n    cout << *(arr + 2) << endl; // arr[2]\r\n    cout << *(arr + 3) << endl; // arr[3]\r\n    cout << *(arr + 4) << endl; // arr[4]\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_03_array_pass_by_reference.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n//  unfinished\r\nvoid func(int arr[] ) {\r\n    arr[0] = 1000;\r\n\r\n}\r\n\r\nvoid func2(int *ptr) {\r\n     ptr[0] = 1000;\r\n    }\r\n\r\n//  unfinished\r\nint main() {\r\n    int a = 5;\r\n    int *ptr = &a;\r\n    cout << ptr << endl; // address-> 0x..\r\n\r\n    int arr[] = {1, 2, 3, 4, 5};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    func(arr);// passing array name is equivalent to passing pointer !\r\n    cout << arr[0] << endl;\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_04_array.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nvoid printArray(int arr[] /* pointer hai ye bhai  ! */, int n) {\r\n\r\n    for (int i = 0; i < n; i++) {\r\n        cout << arr[i] << \" , \";\r\n    }\r\n    cout << endl;\r\n}\r\nint main() {\r\n\r\n    int arr[] = {1, 2, 3, 4, 5};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    printArray(arr, n);\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_05_linear_search.cpp","content":"#include <iostream>\r\nusing namespace std;\r\nint linearSearch(int arr[], int n, int key) {\r\n    for (int i = 0; i < n; i++) {\r\n        if (arr[i] == key) {\r\n            return i;\r\n        }\r\n    }\r\n    return -1;\r\n}\r\n\r\nint main() {\r\n\r\n    int arr[] = {2, 4, 6, 8, 10, 12, 14, 16};\r\n    int n = sizeof(arr) / sizeof(int);\r\n\r\n    cout << linearSearch(arr, n, 10) << endl;\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_06_reverse_an_array_01.cpp","content":"//  method 01: to reverse an array !\r\n\r\n#include <iostream>\r\nusing namespace std;\r\nvoid printArr(int arr[], int n) {\r\n    for (int i = 0; i < n; i++) {\r\n        cout << arr[i] << \" , \";\r\n    }\r\n\r\n    cout << endl;\r\n}\r\n\r\nint main() {\r\n    int arr[] = {5, 4, 3, 9, 2};\r\n    int n = sizeof(arr) / sizeof(int);\r\n\r\n    int copyArr[n];\r\n    for (int i = 0; i < n; i++) {\r\n        int j = n - i - 1;\r\n        copyArr[i] = arr[j];\r\n    }\r\n    for (int i = 0; i < n; i++) {\r\n        arr[i] = copyArr[i];\r\n    }\r\n    printArr(arr, n);\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_07_reverse_an_array.cpp","content":"//  reverse and using two pointers approach !\r\n#include <iostream>\r\nusing namespace std;\r\n//  function that will print the array elements\r\nvoid printArr(int *arr, int n) {\r\n    for (int i = 0; i < n; i++) {\r\n        cout << arr[i] << \" , \";\r\n    }\r\n}\r\nint main() {\r\n\r\n    int arr[] = {5, 4, 3, 9, 2};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    int start = 0, end = n - 1;\r\n    while (start < end) {\r\n        // swap\r\n        // swap(start, end);\r\n        swap(arr[start], arr[end]);\r\n        start++;\r\n        end--;\r\n    }\r\n    printArr(arr, n);\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/03 important problems/_08_binary_search.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n//  binary search function\r\nint binSearch(int *arr, int n, int key) {\r\n    int st = 0, end = n - 1;\r\n    while (st <= end) {\r\n        int mid = (st + end) / 2;\r\n\r\n        if (arr[mid] == key) {\r\n            return mid;            // here we go with our key\r\n        } else if (arr[mid] < key) // 2nd half\r\n        {\r\n            st = mid + 1;\r\n        } else {\r\n            //  1st half\r\n            end = mid - 1;\r\n        }\r\n    }\r\n    return -1; // key not found\r\n}\r\nint main() {\r\n    int arr[] = {2, 4, 6, 8, 10, 12, 14, 16};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    cout << binSearch(arr, n, 44) << endl;\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/04 array pointer/_01_array_pointer.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n/*// lets see how array name is works as the array pointer\r\nint main() {\r\n    int x = 10;\r\n    int *ptr = &x;\r\n    int y = 25;\r\n    ptr = &y;\r\n    cout << *ptr << endl; //  ptr = y : -> 25\r\n    // cout << ptr << endl;\r\n\r\n    return 0;\r\n}*/\r\n\r\nint main() {\r\n    int arr[5];\r\n    cout << arr << endl;\r\n    int y = 25;\r\n    // arr = &y; \r\n\r\n    return 0; }\r\n"},{"path":"CH 10 Array/02 Array  01/04 array pointer/_02_increment_and_decrement_opr.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n//  increment and decrement operator\r\nint main() {\r\n    int a = 10;\r\n    int *aptr = &a;\r\n\r\n    cout << aptr << endl;\r\n    aptr++; // adding one integer space\r\n    cout << aptr << endl;\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/04 array pointer/_03_pointer_array.cpp","content":"#include <iostream>\r\nusing namespace std;\r\n\r\nint main() {\r\n    int a = 5;\r\n    int *ptr = &a;\r\n    cout << ptr << \"\\n\"; // 1st\r\n    ptr++;\r\n    cout << (ptr + 3) << \"\\n\";\r\n    cout << (ptr - 3) << \"\\n\"; // 3rd\r\n    ptr--;\r\n    cout << ptr << \"\\n\"; // 3rd\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/02 Array  01/04 array pointer/_04_traversing_arra_using_pointers.cpp","content":"#include <iostream>\r\nusing namespace std;\r\nvoid printArr(int *ptr, int n) {\r\n    for (int i = 0; i < n; i++) {\r\n        // cout << *(ptr + i) << endl; // method : 02\r\n        // this  is method : 01\r\n        cout << *ptr << endl;\r\n        ptr = ptr + 1;\r\n    }\r\n}\r\n\r\nint main() {\r\n    int arr[] = {1, 2, 3, 4, 5};\r\n    int n = sizeof(arr) / sizeof(int);\r\n    printArr(arr, n);\r\n\r\n    return 0;\r\n}\r\n"},{"path":"CH 10 Array/Quality Questions/_01_second_largest.cpp","content":"#include <iostream>\n#include <climits>\nusing namespace std;\n\n// Quality question: find second largest element in an array.\nint main() {\n    int arr[] = {12, 35, 1, 10, 34, 1};\n    int n = 6;\n    int first = INT_MIN, second = INT_MIN;\n    for (int i = 0; i < n; i++) {\n        if (arr[i] > first) {\n            second = first;\n            first = arr[i];\n        } else if (arr[i] > second && arr[i] != first) {\n            second = arr[i];\n        }\n    }\n    cout << \"Second largest = \" << second << endl;\n    return 0;\n}\n"},{"path":"CH 10 Array/Quality Questions/_02_rotate_array.cpp","content":"#include <iostream>\nusing namespace std;\n\n// Quality question: rotate array left by k positions.\nvoid rotateLeft(int arr[], int n, int k) {\n    k %= n;\n    for (int i = 0; i < k; i++) {\n        int temp = arr[0];\n        for (int j = 0; j < n - 1; j++) arr[j] = arr[j + 1];\n        arr[n - 1] = temp;\n    }\n}\n\nint main() {\n    int arr[] = {1, 2, 3, 4, 5};\n    int n = 5;\n    rotateLeft(arr, n, 2);\n    for (int i = 0; i < n; i++) cout << arr[i] << \" \";\n    cout << endl;\n    return 0;\n}\n"},{"path":"CH 10 Array/Quality Questions/_03_remove_duplicates.cpp","content":"#include <iostream>\nusing namespace std;\n\n// Quality question: remove duplicates from a sorted array.\nint main() {\n    int arr[] = {1, 1, 2, 2, 3, 4, 4, 5};\n    int n = 8;\n    int j = 0;\n    for (int i = 1; i < n; i++) {\n        if (arr[i] != arr[j]) arr[++j] = arr[i];\n    }\n    int newSize = j + 1;\n    cout << \"Unique elements: \";\n    for (int i = 0; i < newSize; i++) cout << arr[i] << \" \";\n    cout << endl;\n    return 0;\n}\n"}],"readme":"<div align=\"center\">\n\n# 🚀 DSA in C++ — My Personal Learning Journey\n\n### *From \"Hello, World!\" to Data Structures & Algorithms — one commit at a time.*\n\n[![Language](https://img.shields.io/badge/Language-C%2B%2B-00599C?style=for-the-badge&logo=cplusplus&logoColor=white)](https://isocpp.org/)\n[![Standard](https://img.shields.io/badge/Standard-C%2B%2B17-00599C?style=for-the-badge&logo=cplusplus&logoColor=white)](https://en.cppreference.com/)\n[![IDE](https://img.shields.io/badge/IDE-VS%20Code-007ACC?style=for-the-badge&logo=visualstudiocode&logoColor=white)](https://code.visualstudio.com/)\n[![Compiler](https://img.shields.io/badge/Compiler-g%2B%2B%20%7C%20MinGW-4EAA25?style=for-the-badge&logo=gnu&logoColor=white)](https://gcc.gnu.org/)\n[![Status](https://img.shields.io/badge/Status-Actively%20Learning-brightgreen?style=for-the-badge)](#-progress-tracker)\n[![Files](https://img.shields.io/badge/C%2B%2B%20Files-176-blueviolet?style=for-the-badge)](#-complete-file-index)\n[![PRs Welcome](https://img.shields.io/badge/PRs-Welcome-ff69b4?style=for-the-badge)](#-contributing)\n[![Live Site](https://img.shields.io/badge/Live%20Site-GitHub%20Pages-222?style=for-the-badge&logo=githubpages)](https://shubham17290.github.io/CPP_2.1/)\n\n<br/>\n\n> **A clean, well-organized, beginner-friendly repository of C++ programs and practice problems**\n> built as part of my personal DSA journey. Every chapter is a folder,\n> every file is a concept, every commit is progress. 📈\n\n<br/>\n\n[📖 About](#-about) · [🗂️ Structure](#-repository-structure) · [📊 Progress](#-progress-tracker) · [⚙️ Run](#️-getting-started) · [📚 Index](#-complete-file-index) · [🤝 Contribute](#-contributing)\n\n</div>\n\n---\n\n## 📖 About\n\nThis repository is my personal learning journal for **Data Structures & Algorithms in C++**, built by following a structured DSA syllabus. It starts from the absolute basics — variables, data types, operators — and grows chapter by chapter into loops, conditionals, patterns, functions, pointers, arrays and beyond, all the way toward full DSA mastery.\n\nThe goal is simple:\n\n- ✅ **Learn by doing** — every concept is backed by runnable C++ code.\n- ✅ **Practice relentlessly** — multiple practice questions and assignment solutions per topic, plus curated **Quality Questions** in every chapter.\n- ✅ **Stay organized** — numbered `CH xx` folders mirror the course syllabus.\n- ✅ **Track progress** — git history tells the story of the journey.\n\n> Whether you're a beginner picking up C++ for the first time or revising fundamentals before\n> diving into DSA, this repo is designed to be **readable, runnable, and reusable**.\n\n---\n\n## ✨ Highlights\n\n- 🧩 **176 self-contained C++ programs** — each file compiles and runs independently.\n- 📁 **Syllabus-aligned folders** — `CH 00 … CH 10` in the exact order you should learn them.\n- 🧪 **Practice + Assignment questions** with full solutions (factorial, Armstrong, prime, Fibonacci, …).\n- ✨ **Quality Questions** subfolder in every chapter with curated, interview-style problems (each folder has its own `README.md` index).\n- 🛠️ **VS Code ready** — `.vscode` config with g++, gdb, and strict warning flags.\n- 📝 **Commented code** — intent and logic explained inline.\n- 🔁 **Git history** — every milestone committed, so you can replay the learning path.\n\n---\n\n## 🗂️ Web Code Browser\n\nBrowse the entire codebase online with syntax highlighting:\n\n**https://shubham17290.github.io/CPP_2.1/**\n\nThe browser is fully self-contained, works offline, and updates automatically on every push.\n\n---\n\n## 📂 Repository Structure\n\n```\nDSA in C++/\n│\n├── 📁 CH 00 Practice/\n│   ├── 01 function/\n│   ├── 02 operators precedence/\n│   └── Quality Questions/\n├── 📁 CH 01 Var and DT/\n│   └── Quality Questions/\n├── 📁 CH 02 Operators/\n│   └── Quality Questions/\n├── 📁 CH 03 Conditionals/\n│   └── Quality Questions/\n├── 📁 CH 04 Loops/\n│   └── Quality Questions/\n├── 📁 CH 05 Statements/\n│   └── Quality Questions/\n├── 📁 CH 06 Patterns/\n│   └── Quality Questions/\n├── 📁 CH 07 Function/\n│   └── Quality Questions/\n├── 📁 CH 08 Binary Number System/\n│   └── Quality Questions/\n├── 📁 CH 09 Pointers/\n│   └── Quality Questions/\n├── 📁 CH 10 Array/\n│   └── Quality Questions/\n│\n├── 📁 .github/workflows/        # GitHub Pages deploy workflow\n├── 📁 .vscode/                 # editor & debugger config\n├── 📁 docs/                    # GitHub Pages site (index.html)\n└── 📄 README.md\n```\n\n---\n\n## 🆕 What's New\n\n- ✨ Added `Quality Questions` subfolder in every chapter (CH 00–CH 10) with curated practice problems.\n- 🧮 Expanded `CH 10 Array` with array pointer traversal, binary search, and more.\n- 🧷 Added `CH 09 Pointers` (pointer basics, dereferencing, pass-by-reference).\n- 🆕 Added `CH 08 Binary Number System` (data types, bin-to-dec, dec-to-bin).\n\n---\n\n## 📊 Progress Tracker\n\nMarked as completed based on the actual content of this repository.\n\n### ✅ Completed\n- [x] **Variables & Data Types** — declaration, initialization, I/O\n- [x] **Operators** — arithmetic, relational, logical, unary, type casting\n- [x] **Conditional Statements** — `if`, `else if`, ternary, `switch`\n- [x] **Loops** — `for`, `while`, `do-while`\n- [x] **Jump Statements** — `break`, `continue`\n- [x] **Prime Numbers** — primality checks\n- [x] **Patterns** — star/number patterns (`CH 06`)\n- [x] **Functions** — parameters, return types, scope, overloading (CH 07)\n- [x] **Binary Number System** — data types, bin-to-dec, dec-to-bin (CH 08)\n- [x] **Pointers & References** — addresses, dereferencing, pass-by-value vs pass-by-reference (CH 09)\n- [x] **Arrays** — declaration, traversal, linear search, reverse, I/O (`CH 10`)\n\n### 🔄 In Progress\n- [ ] **Strings**\n\n### 🗺️ Roadmap (Coming Soon)\n- [ ] Object-Oriented Programming (classes, inheritance, polymorphism)\n- [ ] Recursion & Backtracking\n- [ ] Searching & Sorting\n- [ ] Linked Lists\n- [ ] Stacks & Queues\n- [ ] Trees & Binary Search Trees\n- [ ] Heaps & Hashing\n- [ ] Graphs (BFS, DFS, shortest paths)\n- [ ] Dynamic Programming\n- [ ] Greedy Algorithms\n\n> 💡 **Want this to be a template for *your* DSA repo?** Fork it, keep the `CH xx` structure,\n> and tick boxes as you go. The folder numbering + per-topic practice pattern scales to any\n> DSA syllabus.\n\n---\n\n## ⚙️ Getting Started\n\n### Prerequisites\n\n| Tool | Purpose | Install |\n|------|---------|---------|\n| **g++** (MinGW on Windows) | Compile C++ | [MinGW-w64](https://www.mingw-w64.org/) / `brew install gcc` |\n| **VS Code** (optional) | Editor + debugger | [code.visualstudio.com](https://code.visualstudio.com/) |\n| **Git** | Version control | [git-scm.com](https://git-scm.com/) |\n\nVerify your compiler:\n\n```bash\ng++ --version\n```\n\n### Clone\n\n```bash\ngit clone https://github.com/shubham17290/CPP_2.1.git\ncd \"CPP_2.1\"\n```\n\n---\n\n## ▶️ Running a Program\n\nEach `.cpp` file is **independent**. Compile and run any file like this:\n\n### Linux / macOS\n\n```bash\ng++ -std=c++17 -O2 -Wall -Wextra \"CH 04 Loops/03 practice questions/_03_sum_of_digits.cpp\" -o out\n./out\n```\n\n### Windows (PowerShell / CMD)\n\n```powershell\ng++ -std=c++17 -O2 -Wall -Wextra \"CH 04 Loops\\03 practice questions\\_03_sum_of_digits.cpp\" -o out.exe\n.\\out.exe\n```\n\n### Using VS Code (Recommended)\n\n1. Open the folder in VS Code.\n2. Install the **C/C++** and **C/C++ Runner** extensions.\n3. Open any `.cpp` file and press **`Ctrl + Alt + N`** (Run Code) or use the **Run ▶** button.\n\n> 🧹 **Housekeeping:** compiled `.exe` / `a.out` files are build artifacts and are ignored by git —\n> only the `.cpp` sources matter.\n\n---\n\n## 🧭 Coding Conventions\n\n- 📂 One concept per file; file names describe the problem (`_sum_of_digits.cpp`).\n- 🧾 `#include <iostream>` + `using namespace std;` for beginner readability.\n- 🔢 `int main()` returns `0` on success.\n- 💬 Inline comments explain *why*, not *what*.\n- 🧪 Every practice question is self-contained with its own `cin`/`cout`.\n- ⚠️ Compile with warnings enabled: `-Wall -Wextra -Wpedantic`.\n\n---\n\n## 📚 Complete File Index\n\n<details>\n<summary><b>Click to expand - all 176 C++ source files</b></summary>\n\n<br/>\n\n```\nCH 00 Practice/\n├── 01 function/\n│   ├── _01_pass_by_reference.cpp\n│   └── _02_pass_by_reference.cpp\n├── 02 operators precedence/\n│   └── _01_opr_precednece.cpp\n└── Quality Questions/\n    ├── _01_swap_without_temp.cpp\n    └── _02_operator_precedence_challenge.cpp\nCH 01 Var and DT/\n├── 01 First code/\n│   └── code.cpp\n├── 02 Variables and Data Types/\n│   ├── code.cpp\n│   ├── output.cpp\n│   ├── pattern.cpp\n│   ├── prepocessor.cpp\n│   └── var.cpp\n├── 03 Data Types/\n│   ├── code.cpp\n│   ├── comments.cpp\n│   └── float.cpp\n├── 04 input and output/\n│   ├── argMarks.cpp\n│   ├── arth_on_a_b.cpp\n│   └── see.cpp\n├── 05 assignment Questions/\n│   ├── _question_01.cpp\n│   ├── _question_02.cpp\n│   ├── _question_03.cpp\n│   └── _question_04.cpp\n└── Quality Questions/\ const files = (DATA && DATA.files) ? DATA.files.map(f=>f.path) : [];

function groupFiles(list){
  const root={};
  for(const f of list){
    const parts=f.split('/');
    let cur=root;
    for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
    (cur.__files=cur.__files||[]).push(f);
  }
  return root;
}

const treeEl=document.getElementById('tree');
const contentEl=document.getElementById('content');
const titleEl=document.getElementById('title');
const searchEl=document.getElementById('search');
const copyBtn=document.getElementById('copybtn');
const toast=document.getElementById('toast');
let currentText='';

function renderTree(list){
  const q=searchEl.value.trim().toLowerCase();
  const filtered=q?list.filter(f=>f.toLowerCase().includes(q)):list;
  treeEl.innerHTML='';
  const root=groupFiles(filtered);
  function build(node){
    const frag=document.createDocumentFragment();
    const folders=Object.keys(node).filter(k=>k!=='__files').sort();
    for(const folder of folders){
      const det=document.createElement('details');
      det.className='folder';
      det.open=true;
      const sum=document.createElement('summary');
      sum.innerHTML=`<span class="icon">📁</span><span>${folder}</span>`;
      det.appendChild(sum);
      const child=document.createElement('div');
      child.className='children';
      child.appendChild(build(node[folder]));
      det.appendChild(child);
      frag.appendChild(det);
    }
    for(const f of (node.__files||[]).sort()){
      const btn=document.createElement('button');
      btn.className='file';
      btn.innerHTML=`<span class="icon">📄</span><span class="name">${f.split('/').pop()}</span>`;
      btn.title=f;
      btn.dataset.path=f;
      btn.addEventListener('click',()=>openFile(f));
      frag.appendChild(btn);
    }
    return frag;
  }
  treeEl.appendChild(build(root));
}

searchEl.addEventListener('input',()=>renderTree(files));

function findEntry(path){return (DATA.files||[]).find(f=>f.path===path);}

function openFile(path){
  document.querySelectorAll('.file').forEach(e=>e.classList.toggle('active',e.dataset.path===path));
  titleEl.textContent=path.split('/').pop();
  const entry=findEntry(path);
  currentText=entry?entry.content:'';
  const lines=currentText.split('\n').length;
  contentEl.innerHTML='';
  const card=document.createElement('div');
  card.className='card code-card';
  card.innerHTML=`
    <header><span class="fname">${path}</span><span style="font-size:11px;color:var(--muted)">${lines} lines</span></header>
    <pre><code class="language-cpp"></code></pre>`;
  const code=card.querySelector('code');
  code.textContent=currentText;
  contentEl.appendChild(card);
  hljs.highlightElement(code);
}

function showReadme(){
  document.querySelectorAll('.file').forEach(e=>e.classList.remove('active'));
  titleEl.textContent='README.md';
  currentText=DATA.readme||'';
  contentEl.innerHTML='';
  const div=document.createElement('div');
  div.className='readme';
  div.innerHTML=marked.parse(currentText);
  contentEl.appendChild(div);
}

copyBtn.addEventListener('click',async()=>{
  if(!currentText){showToast('Nothing to copy');return;}
  try{await navigator.clipboard.writeText(currentText);showToast('Copied to clipboard');}
  catch{showToast('Copy failed');}
});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

// init
document.getElementById('statFiles').textContent=files.length;
const chapters=new Set(files.map(f=>f.split('/')[0]));
document.getElementById('statChapters').textContent=chapters.size;
document.getElementById('chip').textContent=files.length+' files';
renderTree(files);
</script>
