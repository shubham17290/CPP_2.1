tent":"\n#include <iostream>\n#include <map>\n#include <unordered_map>\nusing namespace std;\nint main() {\n\n    //  creation of the unordered_map\n    unordered_map<string, string> table;\n    //  insertion\n    //  method 01\n    table[\"in\"] = \"india\";\n    //  method 02\n    table.insert((make_pair)(\"en\", \"england\"));\n\n    //  by making the pairs : method 03\n\n    pair<string, string> p;\n    p.first = \"br\";\n    p.second = \"brazil\";\n    table.insert(p);\n    cout << table.size() << endl;\n\n    if (table.find(\"in\") != table.end()) {\n        cout << \" key found/present !\" << endl;\n\n    } else {\n        cout << \" key not found !\" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/07 Map/01 UnOrdered Map/02 functions and methods/_07_count.cpp","content":"\n#include <iostream>\n#include <map>\n#include <unordered_map>\nusing namespace std;\nint main() {\n\n    //  creation of the unordered_map\n    unordered_map<string, string> table;\n    //  insertion\n    //  method 01\n    table[\"in\"] = \"india\";\n    //  method 02\n    table.insert((make_pair)(\"en\", \"england\"));\n\n    //  by making the pairs : method 03\n\n    pair<string, string> p;\n    p.first = \"br\";\n    p.second = \"brazil\";\n    table.insert(p);\n    cout << table.size() << endl;\n\n    if (table.count(\"in\") == 0) {\n        cout << \" key not found !\" << endl;\n    }\n    if (table.count(\"in\") == 1) {\n        cout << \" key not found !\" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/07 Map/02 Ordered Map/01 Basics/_01_basic.cpp","content":"\n#include <iostream>\n#include <map>\n#include <unordered_map>\nusing namespace std;\nint main() {\n\n    //  creation of the ordered map\n    map<string, string> table;\n    //  insertion\n    //  method 01\n    table[\"in\"] = \"india\";\n    //  method 02\n    table.insert((make_pair)(\"en\", \"england\"));\n\n    //  by making the pairs : method 03\n\n    pair<string, string> p;\n    p.first = \"br\";\n    p.second = \"brazil\";\n    table.insert(p);\n    cout << table.size() << endl;\n\n    /*if (table.empty()) {\n        cout << \"map is empty \";\n\n    } else {\n        cout << \" map is not empty \";\n    }\n*/\n    map<string, string>::iterator it = table.begin();\n    while (it != table.end()) {\n        pair<string, string> p = *it;\n        cout << p.first << \" \" << p.second << endl;\n        it++;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/07 Map/02 Ordered Map/02 functions/_01_basisc.cpp","content":"\n#include <iostream>\n#include <map>\n#include <unordered_map>\nusing namespace std;\nint main() {\n\n    //  creation of the ordered map\n    map<int, string> table;\n    //  first operation on the ordered map !\n    table.insert(make_pair(1, \"love\"));\n    table.insert(make_pair(2, \"anita\"));\n    table.insert(make_pair(3, \"babita\"));\n    table.insert(make_pair(4, \"savita\"));\n\n\n\n    map<int, string>::iterator it = table.begin();\n    while (it != table.end()) {\n        pair<int, string> p = *it;\n        cout << p.first << \" \" << p.second << endl;\n        it++;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/01 bsics of set/_01_basic_of_set.cpp","content":"#include <iostream>\n#include <set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/02 function/_01_erase.cpp","content":"#include <iostream>\n#include <set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    st.erase(st.begin(), st.end());\n    cout << endl << st.size() << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/02 function/_01_size_clear_empty.cpp","content":"#include <iostream>\n#include <set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    cout << endl << st.size() << endl;\n    st.clear();\n    cout << st.size() << endl;\n    if (st.empty()) {\n        cout << \" set is empty\" << endl;\n    } else {\n        cout << \" set is not empty\" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/02 function/_03_find.cpp","content":"#include <iostream>\n#include <set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  finding till the end\n    if (st.find(15) != st.end()) {\n        cout << \" found \" << endl;\n    } else {\n        cout << \" not found \" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/02 function/_04_count.cpp","content":"#include <iostream>\n#include <set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  finding till the end\n    if (st.count(15) == 1) {\n        cout << \" found \" << endl;\n    }\n    if (st.count(15) == 0) {\n        cout << \" not found \" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/01 ordered set/02 function/_check.cpp","content":"#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    vector<int> v = {2, 3, 2, 1, 5, 4, 2};\n\n    // Count the occurrence of 2\n    cout << count(v.begin(), v.end(), 2);\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/02 unord set/01 bsics of set/_01_basic_of_set.cpp","content":"#include <iostream>\n#include <set>\n#include<unordered_set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    unordered_set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    unordered_set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/02 unord set/02 functions/_01_size_clear_empty.cpp","content":"#include <iostream>\n#include <unordered_set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    unordered_set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    unordered_set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    cout << endl << st.size() << endl;\n    st.clear();\n    cout << st.size() << endl;\n    if (st.empty()) {\n        cout << \"set is empty\" << endl;\n    } else {\n        cout << \"set is not empty\" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/02 unord set/02 functions/_02_erase.cpp","content":"#include <iostream>\n#include <unordered_set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    unordered_set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  traverse - > on the set using the iterator\n\n    unordered_set<int>::iterator it = st.begin();\n    while (it != st.end()) {\n        cout << *it << \" \";\n        it++;\n    }\n\n    st.erase(st.begin(), st.end());\n    cout << endl << st.size() << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/01 Containers/08 Set/02 unord set/02 functions/_03_find.cpp","content":"#include <iostream>\n#include <unordered_set>\n\nusing namespace std;\n\nint main() {\n    //  creation of the set\n\n    unordered_set<int> st;\n\n    //  insertion inside the set\n\n    st.insert(10);\n    st.insert(20);\n    st.insert(30);\n    st.insert(40);\n\n    //  finding till the end\n    if (st.find(15) != st.end()) {\n        cout << \" found \" << endl;\n    } else {\n        cout << \" not found \" << endl;\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/02 Iterators/01 basic/_01_iterator_basics.cpp","content":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {10, 20, 30, 40, 50};\n\n    // Iterator declaration\n    vector<int>::iterator itr;\n    vector<int>::iterator itr1;\n\n    itr = v.begin();      // Points to first element\n    itr1 = v.begin() + 2; // Points to third element\n\n    // 1. *itr : Access current element\n    cout << *itr << endl; // 10\n\n    // 2. itr->m : Access member of pointed object\n    // Example: itr->second for map iterators\n\n    // 3. ++itr : Move to next position\n    ++itr;\n    cout << *itr << endl; // 20\n\n    // 4. --itr : Move to previous position\n    --itr;\n    cout << *itr << endl; // 10\n\n    // 5. itr + 1 : Move forward by one position\n    cout << *(itr + 1) << endl; // 20\n\n    // 6. itr1 == itr : Check same position\n    cout << (itr1 == itr) << endl; // 0 (false)\n\n    // 7. itr1 != itr : Check different positions\n    cout << (itr1 != itr) << endl; // 1 (true)\n\n    // 8. itr = itr1 : Assign one iterator to another\n    itr = itr1;\n    cout << *itr << endl; // 30\n\n    return 0;\n}\n"},{"path":"CH 13 STL/02 Iterators/02 types of iterators/_01_input_iterator.cpp","content":"#include <iostream>\n#include <iterator>\n#include <vector>\n#include <sstream>\nusing namespace std;\n\nint main() {\n\n    // INPUT ITERATOR: read-only, single-pass, forward only\n    // e.g. istream_iterator, find() result\n\n    string data = \"1 2 3 4 5\";\n    istringstream iss(data);\n    istream_iterator<int> in(iss), eof;\n\n    cout << \"Input iterator: \";\n    while (in != eof) {\n        cout << *in << \" \";   // read\n        ++in;                 // advance\n    }\n    cout << endl;\n\n    // Supported: *itr, ++itr, ==, !=\n    // Not supported: --itr, itr+n, itr[n], <\n\n    return 0;\n}"},{"path":"CH 13 STL/02 Iterators/02 types of iterators/_02_output_iterator.cpp","content":"#include <iostream>\n#include <iterator>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    // OUTPUT ITERATOR: write-only, single-pass, forward only\n    // e.g. ostream_iterator, back_inserter\n\n    ostream_iterator<int> out(cout, \" \");\n    cout << \"Output iterator: \";\n    for (int x : {10, 20, 30, 40, 50}) {\n        *out = x;   // write\n        ++out;      // advance\n    }\n    cout << endl;\n\n    // back_inserter example\n    vector<int> v;\n    auto bi = back_inserter(v);\n    *bi = 100; ++bi;\n    *bi = 200; ++bi;\n\n    cout << \"back_inserter: \";\n    for (int x : v) cout << x << \" \";\n    cout << endl;\n\n    // Supported: *itr = value, ++itr\n    // Not supported: *itr (read), --itr, comparisons\n\n    return 0;\n}"},{"path":"CH 13 STL/02 Iterators/02 types of iterators/_03_forward_iterator.cpp","content":"#include <iostream>\n#include <forward_list>\nusing namespace std;\n\nint main() {\n\n    // FORWARD ITERATOR: read/write, multi-pass, forward only\n    // e.g. forward_list iterator\n\n    forward_list<int> fl = {10, 20, 30, 40, 50};\n\n    cout << \"Forward: \";\n    for (auto it = fl.begin(); it != fl.end(); ++it)\n        cout << *it << \" \";\n    cout << endl;\n\n    // modify in place\n    for (auto it = fl.begin(); it != fl.end(); ++it)\n        *it += 5;\n\n    cout << \"After +5: \";\n    for (int x : fl) cout << x << \" \";\n    cout << endl;\n\n    // Supported: *itr, *itr=value, ++itr, ==, !=\n    // Not supported: --itr, itr+n, itr[n], <\n\n    return 0;\n}"},{"path":"CH 13 STL/02 Iterators/02 types of iterators/_04_bidirectional_iterator.cpp","content":"#include <iostream>\n#include <list>\nusing namespace std;\n\nint main() {\n\n    // BIDIRECTIONAL ITERATOR: read/write, multi-pass, forward & backward\n    // e.g. list, set, map iterators\n\n    list<int> l = {10, 20, 30, 40, 50};\n\n    cout << \"Forward: \";\n    for (auto it = l.begin(); it != l.end(); ++it)\n        cout << *it << \" \";\n    cout << endl;\n\n    cout << \"Backward: \";\n    auto it = l.end();\n    while (it != l.begin()) {\n        --it;\n        cout << *it << \" \";\n    }\n    cout << endl;\n\n    // Supported: *itr, *itr=value, ++itr, --itr, ==, !=\n    // Not supported: itr+n, itr[n], <\n\n    return 0;\n}\n"},{"path":"CH 13 STL/02 Iterators/02 types of iterators/_05_random_access_iterator.cpp","content":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    // RANDOM ACCESS ITERATOR: read/write, multi-pass, O(1) jump\n    // e.g. vector, deque, array, pointer iterators\n\n    vector<int> v = {10, 20, 30, 40, 50};\n    auto itr = v.begin();\n\n    cout << \"itr[2] = \" << itr[2] << endl;            // 30\n    cout << \"*(itr+3) = \" << *(itr + 3) << endl;      // 40\n    cout << \"distance = \" << (itr + 2 - itr) << endl; // 2\n\n    auto last = v.end() - 1;\n    cout << \"last = \" << *last << endl; // 50\n\n    itr[1] = 999;\n    cout << \"After itr[1]=999: \";\n    for (int x : v)\n        cout << x << \" \";\n    cout << endl;\n\n    // Supported: *itr, *itr=value, ++,--, +n,-n, [], <,<=,>,>=\n    // All operations O(1)\n\n    //  clear block for the random access\n\n    vector<int> arr = {10, 20, 30, 40, 50, 60};\n    vector<int>::iterator it = arr.begin() + 3;\n    cout << *it << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_01_for_each.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {10, 20, 30, 40};\n\n    for_each(v.begin(), v.end(), [](int x) { cout << x << \" \"; });\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_02_find.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {10, 20, 30, 40};\n\n    auto it = find(v.begin(), v.end(), 20);\n\n    if (it != v.end())\n        cout << \"Found: \" << *it << \"\\n\";\n    else\n        cout << \"Not Found\\n\";\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_03_find_if.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 3, 5, 8, 9};\n\n    // Pehla even number\n    auto it = find_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });\n\n    if (it != v.end())\n        cout << \"First even: \" << *it << \"\\n\"; // Output: 8\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_04_count.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 2, 2, 3, 2, 4};\n\n    int cnt = count(v.begin(), v.end(), 2);\n    cout << \"Count of 2: \" << cnt << \"\\n\"; // Output: 3\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_05_count_if.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 2, 3, 4, 5, 6};\n\n    // Count even numbers\n    int cnt = count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });\n\n    cout << \"Even count: \" << cnt << \"\\n\"; // Output: 3\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_06_sort.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {40, 10, 30, 20};\n\n    sort(v.begin(), v.end());\n\n    for (int x : v)\n        cout << x << \" \"; // Output: 10 20 30 40\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_07_reverse.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 2, 3, 4};\n\n    reverse(v.begin(), v.end());\n\n    for (int x : v)\n        cout << x << \" \"; // Output: 4 3 2 1\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_09_unique.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 1, 2, 2, 3, 3, 4};\n\n    v.erase(unique(v.begin(), v.end()), v.end());\n\n    for (int x : v)\n        cout << x << \" \"; // Output: 1 2 3 4\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_10_rotate.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {10, 20, 30, 40, 50};\n\n    // Index 2 (value 30) ko pehla element bana dega\n    rotate(v.begin(), v.begin() + 2, v.end());\n\n    for (int x : v)\n        cout << x << \" \"; // Output: 30 40 50 10 20\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/01 iterators and iterating algorithms/_11_partition.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {1, 2, 3, 4, 5, 6};\n\n    // Even numbers aage, odd peeche\n    partition(v.begin(), v.end(), [](int x) { return x % 2 == 0; });\n\n    for (int x : v)\n        cout << x << \" \"; // Example output: 6 2 4 3 5 1\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/02 Numeric algorithms/_01_numeric_basic.cpp","content":"\n#include <algorithm>\n#include <iostream>\n#include <numeric>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr(5);\n    arr[0] = 10;\n    arr[1] = 20;\n    arr[2] = 30;\n    arr[3] = 40;\n    arr[4] = 50;\n\n    int totalsum = accumulate(arr.begin(), arr.end(), 0);\n    cout << totalsum << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/02 Numeric algorithms/_02_inner_product.cpp","content":"#include <iostream>\n#include <numeric>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> first;\n    first.push_back(1);\n    first.push_back(2);\n    first.push_back(3);\n\n    vector<int> second;\n    second.push_back(3);\n    second.push_back(4);\n    second.push_back(5);\n\n    int ans = inner_product(first.begin(), first.end(), second.begin(), 0);\n    cout << ans << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/02 Numeric algorithms/_03_partial_sum.cpp","content":"#include <iostream>\n#include <numeric>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> first;\n    first.push_back(1);\n    first.push_back(2);\n    first.push_back(3);\n    first.push_back(4);\n    first.push_back(5);\n    vector<int> result(first.size());\n\n    partial_sum(first.begin(), first.end(), result.begin());\n    for (int a : result) {\n        cout << a << \" \";\n    }\n    cout << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/02 Numeric algorithms/_04_iota.cpp","content":"#include <iostream>\n#include <numeric>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> first(5);\n\n    iota(first.begin(), first.end(), 250);\n\n    for (int a : first) {\n        cout << a << \" \";\n    }\n    cout << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/03 Searching and finding algorithms/01 binary search/_01_binary_search.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n\n    vector<int> arr;\n\n    arr.push_back(10);\n    arr.push_back(20);\n    arr.push_back(30);\n    arr.push_back(40);\n    arr.push_back(50);\n    arr.push_back(60);\n    int target = 40;\n    //  this returns the boolean value \n    bool it = binary_search(arr.begin(), arr.end(), target);\n    cout << it << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/03 Searching and finding algorithms/02 lower bound/_01_lower_bound.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n\n    vector<int> arr;\n\n    arr.push_back(10);\n    arr.push_back(20);\n    arr.push_back(30);\n    arr.push_back(40);\n    arr.push_back(50);\n    arr.push_back(60);\n    // this also return the value\n    auto it = lower_bound(arr.begin(), arr.end(), 35);\n    cout << *it << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/03 Searching and finding algorithms/03 upper bound/_01_upper_bound.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n\n    vector<int> arr;\n\n    arr.push_back(10);\n    arr.push_back(20);\n    arr.push_back(30);\n    arr.push_back(40);\n    arr.push_back(50);\n    arr.push_back(60);\n//  this return the actual value of the upper bound \n    auto it = upper_bound(arr.begin(), arr.end(), 40);\n    cout << *it << endl;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/03 Searching and finding algorithms/04 equal range/_01_equal_range.cpp","content":"//  this is home work for me ...\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\nusing namespace std;\n\nint main() {\n    vector<int> v = {10, 20, 30, 30, 30, 40};\n\n    // Finds all occurrences of 30 in one go\n    auto range = equal_range(v.begin(), v.end(), 30);\n    auto first = range.first;\n    auto last = range.second; // C++11/C++14 compatible\n\n    // [first, last) acts like a mini sub-vector of just the 30s\n    for (auto it = first; it != last; ++it) {\n        cout << *it << \" \"; // Output: 30 30 30\n    }\n\n    cout << \"\\nCount: \" << (last - first); // Output: Count: 3\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/04 min max algorithms/_01_min.cpp","content":"#include <algorithm>\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n    int a = 10;\n    int b = 20;\n\n    cout << min(a, b);\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/04 min max algorithms/_02_max.cpp","content":"#include <algorithm>\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n    int a = 10;\n    int b = 20;\n\n    cout << max(a, b);\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/04 min max algorithms/_03_min_element.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {40, 10, 50, 20, 30};\n\n    auto it = min_element(v.begin(), v.end());\n\n    cout << *it;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/04 min max algorithms/_04_max_element.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {40, 10, 50, 20, 30};\n\n    auto it = max_element(v.begin(), v.end());\n\n    cout << *it;\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/05 Heap Algorithm/_01_make_heap.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {10, 40, 20, 50, 30};\n\n    make_heap(v.begin(), v.end());\n\n    cout << \"Max Heap: \";\n\n    for (int x : v) {\n        cout << x << \" \";\n    }\n\n    cout << \"\\nLargest element: \" << v.front();\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/05 Heap Algorithm/_02_push_heap.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {50, 40, 20, 10, 30};\n\n    // Insert new element\n    v.push_back(60);\n\n    // Restore max heap\n    push_heap(v.begin(), v.end());\n\n    for (int x : v) {\n        cout << x << \" \";\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/05 Heap Algorithm/_03_pop_heap.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {50, 40, 20, 10, 30};\n\n    // Move largest element to the end\n    pop_heap(v.begin(), v.end());\n\n    // Actually remove it\n    v.pop_back();\n\n    for (int x : v) {\n        cout << x << \" \";\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/05 Heap Algorithm/_04_sort_heap.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> v = {10, 40, 20, 50, 30};\n\n    // First create max heap\n    make_heap(v.begin(), v.end());\n\n    // Sort heap\n    sort_heap(v.begin(), v.end());\n\n    for (int x : v) {\n        cout << x << \" \";\n    }\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/06 Set algorithms/_01_union.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> a = {1, 2, 3, 4, 5};\n    vector<int> b = {3, 4, 5, 6, 7};\n    vector<int> result;\n\n    set_union(a.begin(), a.end(), b.begin(), b.end(), back_inserter(result));\n\n    for (int x : result)\n        cout << x << \" \";\n\n    return 0;\n}"},{"path":"CH 13 STL/03 Algorithms/06 Set algorithms/_02_intersection.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> a = {1, 2, 3, 4, 5};\n    vector<int> b = {3, 4, 5, 6, 7};\n    vector<int> result;\n\n    set_intersection(a.begin(), a.end(), b.begin(), b.end(), back_inserter(result));\n\n    for (int x : result)\n        cout << x << \" \";\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/06 Set algorithms/_03_difference.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> a = {1, 2, 3, 4, 5};\n    vector<int> b = {3, 4, 5, 6, 7};\n    vector<int> result;\n\n    set_difference(a.begin(), a.end(), b.begin(), b.end(), back_inserter(result));\n\n    for (int x : result)\n        cout << x << \" \";\n\n    return 0;\n}\n"},{"path":"CH 13 STL/03 Algorithms/06 Set algorithms/_04_set_symmetric_difference.cpp","content":"#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n\n    vector<int> a = {1, 2, 3, 4, 5};\n    vector<int> b = {3, 4, 5, 6, 7};\n    vector<int> result;\n\n    set_symmetric_difference(a.begin(), a.end(), b.begin(), b.end(), back_inserter(result));\n\n    for (int x : result)\n        cout << x << \" \";\n\n    return 0;\n}\n"},{"path":"CH 14 2D Arrays/01 intro/_01_introduction_to_2d_arrau.cpp","content":"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int students[3][3] = {\n\n        {100, 100, 100}, {85, 74, 89}, {63, 72, 65}\n\n    };\n    cout << students[1][1] << endl;\n\n    return 0;\n}\n"},{"path":"CH 14 2D Arrays/02 input and output/_01_input_and_output.cpp","content":"#include <iostream>\n\nusing namespace std;\n\nint main() {\n    // ---- Dimensions as named constants (easier to change later) ----\n    const int ROWS = 3;\n    const int COLS = 4;\n\n    int arr[ROWS][COLS]; // holds ROWS * COLS = 12 values\n\n    // ---- Input: fill the 2D array ----\n    cout << \"Enter \" << ROWS * COLS << \" numbers: \" << endl;\n    for (int i = 0; i < ROWS; ++i) {\n        for (int j = 0; j < COLS; ++j) {\n            cin >> arr[i][j];\n        }\n    }\n\n    // ---- Output: traverse and print the 2D array ----\n    int count = 0;\n    for (int i = 0; i < ROWS; ++i) {\n        for (int j = 0; j < COLS; ++j) {\n            cout << arr[i][j] << \"    \";\n            ++count;\n        }\n        cout << endl;\n    }\n\n    cout << \"Total elements printed: \" << count << endl;\n\n    return 0;\n}\n"},{"path":"CH 14 2D Arrays/03 Spiral Matrix/_01_basic_of_sprial_matrix.cpp","content":"#include <iostream>\nusing namespace std;\n\nint main()\n{\n    \n\n    return 0;\n}"}],"readme":"<div align=\"center\">\r\n\r\n# 🚀 DSA in C++ — My Personal Learning Journey\r\n\r\n### *From \"Hello, World!\" to Data Structures & Algorithms — one commit at a time.*\r\n\r\n[![Language](https://img.shields.io/badge/Language-C%2B%2B-00599C?style=for-the-badge&logo=cplusplus&logoColor=white)](https://isocpp.org/)\r\n[![Standard](https://img.shields.io/badge/Standard-C%2B%2B17-00599C?style=for-the-badge&logo=cplusplus&logoColor=white)](https://en.cppreference.com/)\r\n[![IDE](https://img.shields.io/badge/IDE-VS%20Code-007ACC?style=for-the-badge&logo=visualstudiocode&logoColor=white)](https://code.visualstudio.com/)\r\n[![Compiler](https://img.shields.io/badge/Compiler-g%2B%2B%20%7C%20MinGW-4EAA25?style=for-the-badge&logo=gnu&logoColor=white)](https://gcc.gnu.org/)\r\n[![Status](https://img.shields.io/badge/Status-Actively%20Learning-brightgreen?style=for-the-badge)](#-progress-tracker)\r\n[![Files](https://img.shields.io/badge/C%2B%2B%20Files-324-blueviolet?style=for-the-badge)](#-complete-file-index)\r\n[![PRs Welcome](https://img.shields.io/badge/PRs-Welcome-ff69b4?style=for-the-badge)](#-contributing)\r\n[![Live Site](https://img.shields.io/badge/Live%20Site-GitHub%20Pages-222?style=for-the-badge&logo=githubpages)](https://shubham17290.github.io/CPP_2.1/)\r\n\r\n<br/>\r\n\r\n> **A clean, well-organized, beginner-friendly repository of C++ programs and practice problems**\r\n> built as part of my personal DSA journey. Every chapter is a folder,\r\n> every file is a concept, every commit is progress. 📈\r\n\r\n<br/>\r\n\r\n[📖 About](#-about) · [🗂️ Structure](#-repository-structure) · [📊 Progress](#-progress-tracker) · [⚙️ Run](#️-getting-started) · [📚 Index](#-complete-file-index) · [🤝 Contribute](#-contributing)\r\n\r\n</div>\r\n\r\n---\r\n\r\n## 📖 About\r\n\r\nThis repository is my personal learning journal for **Data Structures & Algorithms in C++**, built by following a structured DSA syllabus. It starts from the absolute basics — variables, data types, operators — and grows chapter by chapter into loops, conditionals, patterns, functions, pointers, arrays and beyond, all the way toward full DSA mastery.\r\n\r\nThe goal is simple:\r\n\r\n- ✅ **Learn by doing** — every concept is backed by runnable C++ code.\r\n- ✅ **Practice relentlessly** — multiple practice questions and assignment solutions per topic, plus curated **Quality Questions** in every core chapter.\r\n- ✅ **Stay organized** — numbered `CH xx` folders mirror the course syllabus.\r\n- ✅ **Track progress** — git history tells the story of the journey.\r\n\r\n> Whether you're a beginner picking up C++ for the first time or revising fundamentals before\r\n> diving into DSA, this repo is designed to be **readable, runnable, and reusable**.\r\n\r\n---\r\n\r\n## ✨ Highlights\r\n\r\n- 🧩 **324 self-contained C++ programs** — each file compiles and runs independently.\r\n- 📁 **Syllabus-aligned folders** — `CH 00 … CH 14` in the exact order you should learn them.\r\n- 🧱 **C++ STL coverage** — containers, iterators, and algorithms (`CH 13`), including the `binary_search` / `lower_bound` / `upper_bound` / `equal_range` family, plus heap, set, and min/max algorithms.\r\n- 🔃 **Sorting algorithms** — bubble, selection, insertion, counting, and in-built `sort()` (`CH 12`).\r\n- 🧪 **Practice + Assignment questions** with full solutions (factorial, Armstrong, prime, Fibonacci, …).\r\n- ✨ **Quality Questions** subfolder in every core chapter (CH 00–CH 10) with curated, interview-style problems (each folder has its own `README.md` index).\r\n- 🛠️ **VS Code ready** — `.vscode` config with g++, gdb, and strict warning flags.\r\n- 📝 **Commented code** — intent and logic explained inline.\r\n- 🔁 **Git history** — every milestone committed, so you can replay the learning path.\r\n\r\n---\r\n\r\n## 🗂️ Web Code Browser\r\n\r\nBrowse the entire codebase online with syntax highlighting:\r\n\r\n**https://shubham17290.github.io/CPP_2.1/**\r\n\r\nThe browser is fully self-contained, works offline, and updates automatically on every push.\r\n\r\n---\r\n\r\n## 📂 Repository Structure\r\n\r\n```\r\nDSA in C++/\r\n│\r\n├── 📁 CH 00 Practice/\r\n│   ├── 01 function/\r\n│   ├── 02 operators precedence/\r\n│   └── Quality Questions/\r\n├── 📁 CH 01 Var and DT/\r\n│   └── Quality Questions/\r\n├── 📁 CH 02 Operators/\r\n│   └── Quality Questions/\r\n├── 📁 CH 03 Conditionals/\r\n│   └── Quality Questions/\r\n├── 📁 CH 04 Loops/\r\n│   └── Quality Questions/\r\n├── 📁 CH 05 Statements/\r\n│   └── Quality Questions/\r\n├── 📁 CH 06 Patterns/\r\n│   └── Quality Questions/\r\n├── 📁 CH 07 Function/\r\n│   └── Quality Questions/\r\n├── 📁 CH 08 Binary Number System/\r\n│   └── Quality Questions/\r\n├── 📁 CH 09 Pointers/\r\n│   └── Quality Questions/\r\n├── 📁 CH 10 Array I/\r\n│   └── Quality Questions/\r\n├── 📁 CH 12 Array II/\r\n│   └── 01 Sorting/\r\n├── 📁 CH 13 STL/00 vector(APC)/\r\n│   ├── 01 basics of the vector/\r\n│   ├── 02 Vector Function/\r\n│   └── 03 Static and dynamic/\r\n├── 📁 CH 13 STL/\r\n│   ├── 01 Containers/\r\n│   ├── 02 Iterators/\r\n│   └── 03 Algorithms/\r\n├── 📁 CH 14 2D Arrays/\r\n│   ├── 01 intro/\r\n│   ├── 02 input and output/\r\n│   └── 03 Spiral Matrix/\r\n│\r\n├── 📁 .github/workflows/        # GitHub Pages deploy workflow\r\n├── 📁 .vscode/                 # editor & debugger config\r\n├── 📁 docs/                    # GitHub Pages site (index.html)\r\n└── 📄 README.md\r\n```\r\n\r\n---\r\n\r\n## 🆕 What's New\r\n\r\n- 🧭 Started `CH 14 2D Arrays` — introduction, input/output traversal, and spiral matrix basics.\r\n- 🔃 Added `CH 12 Array II → 01 Sorting` — bubble (with optimization), selection, insertion,\r\n  counting sort, in-built `sort()` (ascending & descending), plus practice solutions.\r\n- 🧮 Added `CH 13 STL → 03 Algorithms → 04 min max algorithms` (`min`, `max`, `min_element`, `max_element`).\r\n- ⛰️ Added `CH 13 STL → 03 Algorithms → 05 Heap Algorithm` (`make_heap`, `push_heap`, `pop_heap`, `sort_heap`).\r\n- 🔷 Added `CH 13 STL → 03 Algorithms → 06 Set algorithms` (`set_union`, `set_intersection`,\r\n  `set_difference`, `set_symmetric_difference`).\r\n- 🔁 Added `CH 13 STL → 02 Iterators` — iterator basics and all five iterator categories.\r\n- 🔎 Added `CH 13 STL → 03 Algorithms → 03 Searching and finding algorithms` with\r\n  `binary_search`, `lower_bound`, `upper_bound`, and an `equal_range` homework placeholder.\r\n- 🧮 Added `CH 13 STL → 03 Algorithms → 02 Numeric algorithms` (`accumulate`,\r\n  `inner_product`, `partial_sum`, `iota`).\r\n- 🔁 Added `CH 13 STL → 03 Algorithms → 01 iterators and iterating algorithms`\r\n  (`for_each`, `find`, `find_if`, `count`, `count_if`, `sort`, `reverse`, `unique`,\r\n  `rotate`, `partition`).\r\n- 📦 Added `CH 13 STL → 01 Containers` coverage for vector, list, queue, stack,\r\n  deque, priority queue, map, and set.\r\n- 🧷 Added `CH 13 STL/00 vector(APC)` and `CH 09 Pointers` fundamentals.\r\n- ✨ Added a `Quality Questions` subfolder in every chapter (CH 00–CH 10) with curated practice problems.\r\n\r\n---\r\n\r\n## 📊 Progress Tracker\r\n\r\nMarked as completed based on the actual content of this repository.\r\n\r\n### ✅ Completed\r\n- [x] **Variables & Data Types** — declaration, initialization, I/O\r\n- [x] **Operators** — arithmetic, relational, logical, unary, type casting\r\n- [x] **Conditional Statements** — `if`, `else if`, ternary, `switch`\r\n- [x] **Loops** — `for`, `while`, `do-while`\r\n- [x] **Jump Statements** — `break`, `continue`\r\n- [x] **Prime Numbers** — primality checks\r\n- [x] **Patterns** — star/number patterns (`CH 06`)\r\n- [x] **Functions** — parameters, return types, scope, overloading (CH 07)\r\n- [x] **Binary Number System** — data types, bin-to-dec, dec-to-bin (CH 08)\r\n- [x] **Pointers & References** — addresses, dereferencing, pass-by-value vs pass-by-reference (CH 09)\r\n- [x] **Arrays** — declaration, traversal, linear search, reverse, I/O (`CH 10`)\r\n- [x] **Sorting** — bubble, selection, insertion, counting, in-built `sort()` (`CH 12`)\r\n- [x] **Vectors** — declaration, member functions, static vs dynamic behavior (`CH 13 → 00 vector(APC)`)\r\n- [x] **STL Containers** — vector, list, queue, stack, deque, priority queue, map, set (`CH 13`)\r\n- [x] **STL Iterators** — iterator basics, types, and ranges (`CH 13`)\r\n- [x] **STL Algorithms** — iterating, numeric, searching, min/max, heap, and set algorithms (`CH 13`)\r\n\r\n### 🔄 In Progress\r\n- [ ] **2D Arrays** — intro, input/output, spiral matrix (`CH 14`)\r\n- [ ] **Strings**\r\n\r\n### 🗺️ Roadmap (Coming Soon)\r\n- [ ] Object-Oriented Programming (classes, inheritance, polymorphism)\r\n- [ ] Recursion & Backtracking\r\n- [ ] Linked Lists\r\n- [ ] Stacks & Queues\r\n- [ ] Trees & Binary Search Trees\r\n- [ ] Heaps & Hashing\r\n- [ ] Graphs (BFS, DFS, shortest paths)\r\n- [ ] Dynamic Programming\r\n- [ ] Greedy Algorithms\r\n\r\n> 💡 **Want this to be a template for *your* DSA repo?** Fork it, keep the `CH xx` structure,\r\n> and tick boxes as you go. The folder numbering + per-topic practice pattern scales to any\r\n> DSA syllabus.\r\n\r\n---\r\n\r\n## ⚙️ Getting Started\r\n\r\n### Prerequisites\r\n\r\n| Tool | Purpose | Install |\r\n|------|---------|---------|\r\n| **g++** (MinGW on Windows) | Compile C++ | [MinGW-w64](https://www.mingw-w64.org/) / `brew install gcc` |\r\n| **VS Code** (optional) | Editor + debugger | [code.visualstudio.com](https://code.visualstudio.com/) |\r\n| **Git** | Version control | [git-scm.com](https://git-scm.com/) |\r\n\r\nVerify your compiler:\r\n\r\n```bash\r\ng++ --version\r\n```\r\n\r\n### Clone\r\n\r\n```bash\r\ngit clone https://github.com/shubham17290/CPP_2.1.git\r\ncd \"CPP_2.1\"\r\n```\r\n\r\n---\r\n\r\n## ▶️ Running a Program\r\n\r\nEach `.cpp` file is **independent**. Compile and run any file like this:\r\n\r\n### Linux / macOS\r\n\r\n```bash\r\ng++ -std=c++17 -O2 -Wall -Wextra \"CH 04 Loops/03 practice questions/_03_sum_of_digits.cpp\" -o out\r\n./out\r\n```\r\n\r\n### Windows (PowerShell / CMD)\r\n\r\n```powershell\r\ng++ -std=c++17 -O2 -Wall -Wextra \"CH 04 Loops\\03 practice questions\\_03_sum_of_digits.cpp\" -o out.exe\r\n.\\out.exe\r\n```\r\n\r\n### Using VS Code (Recommended)\r\n\r\n1. Open the folder in VS Code.\r\n2. Install the **C/C++** and **C/C++ Runner** extensions.\r\n3. Open any `.cpp` file and press **`Ctrl + Alt + N`** (Run Code) or use the **Run ▶** button.\r\n\r\n> 🧹 **Housekeeping:** compiled `.exe` / `a.out` files are build artifacts and are ignored by git —\r\n> only the `.cpp` sources matter.\r\n\r\n---\r\n\r\n## 🧭 Coding Conventions\r\n\r\n- 📂 One concept per file; file names describe the problem (`_sum_of_digits.cpp`).\r\n- 🧾 `#include <iostream>` + `using namespace std;` for beginner readability.\r\n- 🔢 `int main()` returns `0` on success.\r\n- 💬 Inline comments explain *why*, not *what*.\r\n- 🧪 Every practice question is self-contained with its own `cin`/`cout`.\r\n- ⚠️ Compile with warnings enabled: `-Wall -Wextra -Wpedantic`.\r\n\r\n---\r\n\r\n## 📚 Complete File Index\r\n\r\n<details>\r\n<summary><b>Click to expand - all 324 C++ source files</b></summary>\r\n\r\n<br/>\r\n\r\n```\r\nCH 00 Practice/\r\n├── 01 function/\r\n│   ├── _01_pass_by_reference.cpp\r\n│   └── _02_pa const files = (DATA && DATA.files) ? DATA.files.map(f=>f.path) : [];

function groupFiles(list){
  const root={};
  for(const f of list){
    const parts=f.split('/');
    let cur=root;
    for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
    (cur.__files=cur.__files||[]).push(f);
  }
  return root;
}

const treeEl=document.getElementById('tree');
const contentEl=document.getElementById('content');
const titleEl=document.getElementById('title');
const searchEl=document.getElementById('search');
const copyBtn=document.getElementById('copybtn');
const toast=document.getElementById('toast');
let currentText='';

function renderTree(list){
  const q=searchEl.value.trim().toLowerCase();
  const filtered=q?list.filter(f=>f.toLowerCase().includes(q)):list;
  treeEl.innerHTML='';
  const root=groupFiles(filtered);
  function build(node){
    const frag=document.createDocumentFragment();
    const folders=Object.keys(node).filter(k=>k!=='__files').sort();
    for(const folder of folders){
      const det=document.createElement('details');
      det.className='folder';
      det.open=true;
      const sum=document.createElement('summary');
      sum.innerHTML=`<span class="icon">📁</span><span>${folder}</span>`;
      det.appendChild(sum);
      const child=document.createElement('div');
      child.className='children';
      child.appendChild(build(node[folder]));
      det.appendChild(child);
      frag.appendChild(det);
    }
    for(const f of (node.__files||[]).sort()){
      const btn=document.createElement('button');
      btn.className='file';
      btn.innerHTML=`<span class="icon">📄</span><span class="name">${f.split('/').pop()}</span>`;
      btn.title=f;
      btn.dataset.path=f;
      btn.addEventListener('click',()=>openFile(f));
      frag.appendChild(btn);
    }
    return frag;
  }
  treeEl.appendChild(build(root));
}

searchEl.addEventListener('input',()=>renderTree(files));

function findEntry(path){return (DATA.files||[]).find(f=>f.path===path);}

function openFile(path){
  document.querySelectorAll('.file').forEach(e=>e.classList.toggle('active',e.dataset.path===path));
  titleEl.textContent=path.split('/').pop();
  const entry=findEntry(path);
  currentText=entry?entry.content:'';
  const lines=currentText.split('\n').length;
  contentEl.innerHTML='';
  const card=document.createElement('div');
  card.className='card code-card';
  card.innerHTML=`
    <header><span class="fname">${path}</span><span style="font-size:11px;color:var(--muted)">${lines} lines</span></header>
    <pre><code class="language-cpp"></code></pre>`;
  const code=card.querySelector('code');
  code.textContent=currentText;
  contentEl.appendChild(card);
  hljs.highlightElement(code);
}

function showReadme(){
  document.querySelectorAll('.file').forEach(e=>e.classList.remove('active'));
  titleEl.textContent='README.md';
  currentText=DATA.readme||'';
  contentEl.innerHTML='';
  const div=document.createElement('div');
  div.className='readme';
  div.innerHTML=marked.parse(currentText);
  contentEl.appendChild(div);
}

copyBtn.addEventListener('click',async()=>{
  if(!currentText){showToast('Nothing to copy');return;}
  try{await navigator.clipboard.writeText(currentText);showToast('Copied to clipboard');}
  catch{showToast('Copy failed');}
});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

// init
document.getElementById('statFiles').textContent=files.length;
const chapters=new Set(files.map(f=>f.split('/')[0]));
document.getElementById('statChapters').textContent=chapters.size;
document.getElementById('chip').textContent=files.length+' files';
renderTree(files);
