<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA in C++ — Code Browser</title>
<meta name="description" content="Browse the DSA in C++ learning repository: chapters, practice problems and solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#0a0e1a;--bg2:#0f1526;
  --panel:rgba(22,27,34,0.72);--panel-solid:#161b22;
  --border:rgba(240,246,252,0.08);--border-strong:rgba(240,246,252,0.14);
  --text:#e6edf3;--muted:#8b949e;--subtle:#6e7681;
  --accent:#7c5cff;--accent2:#3ea6ff;--grad:linear-gradient(135deg,#7c5cff 0%,#3ea6ff 100%);
  --hover:rgba(255,255,255,0.04);--active:rgba(124,92,255,0.16);
  --code-bg:#0d1117;--shadow:0 10px 40px rgba(0,0,0,0.45);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(124,92,255,0.18),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,rgba(62,166,255,0.14),transparent 60%),
             var(--bg);
  color:var(--text);display:flex;overflow:hidden;
}
/* animated grid */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);pointer-events:none;z-index:0}

#sidebar{
  width:340px;min-width:260px;background:var(--panel);backdrop-filter:blur(14px);
  border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:1;
  box-shadow:inset -1px 0 0 var(--border);
}
#sidebar header{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 6px 18px rgba(124,92,255,0.4)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.3px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.searchbox{margin-top:14px;position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--subtle);width:16px;height:16px}
#search{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--border-strong);background:rgba(0,0,0,0.35);color:var(--text);font-size:13px;outline:none;transition:border .2s,box-shadow .2s}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,0.2)}
#tree{flex:1;overflow:auto;padding:10px 8px 16px}
#tree::-webkit-scrollbar{width:8px}
#tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:8px}

.folder{margin:2px 0}
.folder>summary{cursor:pointer;padding:7px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none;user-select:none;transition:background .15s,color .15s}
.folder>summary::-webkit-details-marker{display:none}
.folder>summary::before{content:'▸';font-size:11px;color:var(--subtle);transition:transform .2s;display:inline-block;width:10px}
.folder[open]>summary::before{transform:rotate(90deg)}
.folder>summary:hover{background:var(--hover);color:var(--text)}
.folder>summary .icon{font-size:14px}
.folder .children{padding-left:14px;margin-top:2px;border-left:1px solid var(--border);margin-left:14px}

.file{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--text);text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s,transform .15s;margin:1px 0}
.file:hover{background:var(--hover)}
.file.active{background:var(--active);color:#fff;box-shadow:inset 0 0 0 1px rgba(124,92,255,0.35)}
.file .icon{font-size:13px;opacity:.9}
.file .name{overflow:hidden;text-overflow:ellipsis}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.topbar{
  padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
  background:rgba(22,27,34,0.55);backdrop-filter:blur(10px);
}
.topbar .title{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(124,92,255,0.15);color:#b9a8ff;border:1px solid rgba(124,92,255,0.3);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--border-strong);background:rgba(255,255,255,0.04);color:var(--text);font-size:12px;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover{background:rgba(255,255,255,0.08)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(124,92,255,0.35)}
.btn.primary:hover{transform:translateY(-1px)}

#content{flex:1;overflow:auto;padding:24px 28px}
#content::-webkit-scrollbar{width:10px}
#content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.code-card header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.25)}
.code-card header .fname{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text)}
.code-card pre{margin:0;padding:18px 20px;background:var(--code-bg);overflow:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65}
.code-card code{font-family:inherit}

.hero{max-width:760px;margin:40px auto;text-align:center}
.hero h2{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:15px;margin:12px 0 26px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 14px}
.stat .num{font-size:26px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.quick .btn{font-size:12px}

.readme{max-width:920px;margin:0 auto;line-height:1.75;font-size:15px}
.readme h1,.readme h2,.readme h3{letter-spacing:-0.5px;margin-top:28px}
.readme h1{font-size:30px;border-bottom:1px solid var(--border);padding-bottom:10px}
.readme h2{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:8px}
.readme h3{font-size:17px}
.readme p{color:#d0d7de}
.readme a{color:var(--accent2)}
.readme code{background:rgba(110,118,129,0.25);padding:2px 6px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.readme pre{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto}
.readme pre code{background:none;padding:0}
.readme blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:14px 0;color:var(--muted);background:rgba(124,92,255,0.06);border-radius:0 8px 8px 0}
.readme img{max-width:100%;border-radius:10px}
.readme table{width:100%;border-collapse:collapse;margin:14px 0}
.readme th,.readme td{border:1px solid var(--border);padding:8px 12px}
.readme th{background:rgba(255,255,255,0.04)}

.empty{color:var(--muted);padding:60px 20px;text-align:center;font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel-solid);border:1px solid var(--border-strong);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:820px){
  body{flex-direction:column}
  #sidebar{width:100%;height:42vh;min-width:0}
  .stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <div class="brand">
      <div class="logo">C++</div>
      <div>
        <h1>DSA in C++</h1>
        <p>Learning journey · code browser</p>
      </div>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" placeholder="Search files or folders...">
    </div>
  </header>
  <div id="tree"></div>
</aside>

<main id="main">
  <div class="topbar">
    <span class="title" id="title">Welcome</span>
    <span class="chip" id="chip">71 files</span>
    <a class="btn" id="rawlink" href="#" target="_blank" rel="noopener">Raw</a>
    <button class="btn" id="copybtn">Copy</button>
  </div>
  <div id="content">
    <div class="hero">
      <h2>Explore the codebase</h2>
      <p>Browse chapters, practice problems and solutions. Pick a file from the sidebar, or read the README to get started.</p>
      <div class="stats">
        <div class="stat"><div class="num" id="statFiles">—</div><div class="lbl">C++ source files</div></div>
        <div class="stat"><div class="num" id="statChapters">—</div><div class="lbl">Chapters</div></div>
        <div class="stat"><div class="num">C++17</div><div class="lbl">Standard</div></div>
      </div>
      <div class="quick">
        <button class="btn primary" onclick="showReadme()">Read README</button>
        <a class="btn" href="https://github.com/shubham17290/CPP_2.1" target="_blank" rel="noopener">GitHub repo</a>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast">Copied to clipboard</div>

<script>
const FILES_URL='file-list.json';
let files=[]; let currentText='';
const treeEl=document.getElementById('tree');
const contentEl=document.getElementById('content');
const titleEl=document.getElementById('title');
const rawLink=document.getElementById('rawlink');
const searchEl=document.getElementById('search');
const copyBtn=document.getElementById('copybtn');
const toast=document.getElementById('toast');

function encPath(p){return p.split('/').map(encodeURIComponent).join('/');}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),1800);}

async function loadManifest(){
  const res=await fetch(FILES_URL);
  files=await res.json();
  document.getElementById('statFiles').textContent=files.length;
  const chapters=new Set(files.map(f=>f.split('/')[0]));
  document.getElementById('statChapters').textContent=chapters.size;
  document.getElementById('chip').textContent=files.length+' files';
  renderTree(files);
}

function groupFiles(list){
  const root={};
  for(const f of list){
    const parts=f.split('/');
    let cur=root;
    for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
    (cur.__files=cur.__files||[]).push(f);
  }
  return root;
}

function renderTree(list){
  const q=searchEl.value.trim().toLowerCase();
  const filtered=q?list.filter(f=>f.toLowerCase().includes(q)):list;
  treeEl.innerHTML='';
  const root=groupFiles(filtered);
  function build(node){
    const frag=document.createDocumentFragment();
    const folders=Object.keys(node).filter(k=>k!=='__files').sort();
    for(const folder of folders){
      const det=document.createElement('details');
      det.className='folder';
      det.open=q?true:false;
      const sum=document.createElement('summary');
      sum.innerHTML=`<span class="icon">📁</span><span>${folder}</span>`;
      det.appendChild(sum);
      const child=document.createElement('div');
      child.className='children';
      child.appendChild(build(node[folder]));
      det.appendChild(child);
      frag.appendChild(det);
    }
    for(const f of (node.__files||[]).sort()){
      const a=document.createElement('a');
      a.className='file';
      a.innerHTML=`<span class="icon">📄</span><span class="name">${f.split('/').pop()}</span>`;
      a.title=f;
      a.dataset.path=f;
      a.addEventListener('click',e=>{e.preventDefault();openFile(f);});
      frag.appendChild(a);
    }
    return frag;
  }
  treeEl.appendChild(build(root));
  // open all if searching
  if(q) treeEl.querySelectorAll('details').forEach(d=>d.open=true);
}

searchEl.addEventListener('input',()=>renderTree(files));

async function openFile(path){
  document.querySelectorAll('.file').forEach(e=>e.classList.toggle('active',e.dataset.path===path));
  titleEl.textContent=path.split('/').pop();
  rawLink.href=encPath(path);
  contentEl.innerHTML='<div class="empty">Loading…</div>';
  try{
    const res=await fetch(encPath(path));
    const text=await res.text();
    currentText=text;
    const card=document.createElement('div');
    card.className='card code-card';
    card.innerHTML=`
      <header><span class="fname">${path}</span><span style="font-size:11px;color:var(--muted)">${text.split('\\n').length} lines</span></header>
      <pre><code class="language-cpp"></code></pre>`;
    const code=card.querySelector('code');
    code.textContent=text;
    contentEl.innerHTML='';
    contentEl.appendChild(card);
    hljs.highlightElement(code);
  }catch(err){
    contentEl.innerHTML='<div class="empty">Failed to load file.</div>';
    currentText='';
  }
}

async function showReadme(){
  document.querySelectorAll('.file').forEach(e=>e.classList.remove('active'));
  titleEl.textContent='README.md';
  rawLink.href='README.md';
  contentEl.innerHTML='<div class="empty">Loading…</div>';
  try{
    const res=await fetch('README.md');
    const md=await res.text();
    currentText=md;
    const div=document.createElement('div');
    div.className='readme';
    div.innerHTML=marked.parse(md);
    contentEl.innerHTML='';
    contentEl.appendChild(div);
  }catch(err){
    contentEl.innerHTML='<div class="empty">README not found.</div>';
    currentText='';
  }
}

copyBtn.addEventListener('click',async()=>{
  if(!currentText){showToast('Nothing to copy');return;}
  try{await navigator.clipboard.writeText(currentText);showToast('Copied to clipboard');}
  catch{showToast('Copy failed');}
});

loadManifest();
</script>
</body>
</html>
